# 大肥鱼:记忆网关 + 事实库(Hindsight) + 情感库(Ombre-Brain),运行在 WSL(ADR-0008)。
# 只有网关端口发布到宿主机 127.0.0.1;两个记忆库只在 Compose 内网可达(ADR-0006)。
# 用法:cp .env.example .env && 填好密钥 && docker compose up -d

services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on: [hindsight, ombre]
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      GATEWAY_DEVICES: ${GATEWAY_DEVICES:?例如 pc=随机串A,phone=随机串B}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.deepseek.com}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-deepseek-flash}
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_BANK: dafeiyu
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?}
      OMBRE_MCP_URL: http://ombre:8000/mcp
      OMBRE_MCP_TOKEN: ${OMBRE_MCP_TOKEN:?}
    volumes:
      - ./data/gateway:/data

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-1.1.0}
    restart: unless-stopped
    environment:
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?}
      # 事实抽取:默认与陪聊共用同一个上游(中转),可用 MEMORY_LLM_* 单独指定
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-${UPSTREAM_BASE_URL}}
      HINDSIGHT_API_LLM_MODEL: ${MEMORY_LLM_MODEL:-${UPSTREAM_MODEL}}
      HINDSIGHT_API_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-${UPSTREAM_API_KEY}}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: https://api.siliconflow.cn/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: BAAI/bge-m3
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${SILICONFLOW_API_KEY:?}
      HINDSIGHT_API_RERANKER_PROVIDER: siliconflow
      HINDSIGHT_API_RERANKER_SILICONFLOW_MODEL: BAAI/bge-reranker-v2-m3
      HINDSIGHT_API_RERANKER_SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?}
      HINDSIGHT_API_MCP_ENABLED: "false"
    volumes:
      - ./data/hindsight:/home/hindsight/.pg0

  ombre:
    image: p0luz/ombre-brain:${OMBRE_VERSION:-3.6.14}
    restart: unless-stopped
    environment:
      OMBRE_TRANSPORT: streamable-http
      OMBRE_MCP_AUTH_MODE: token
      OMBRE_MCP_TOKEN: ${OMBRE_MCP_TOKEN:?}
      OMBRE_CONFIG_PATH: /app/buckets/config.yaml
      # 情感打标:同上,默认走陪聊的上游;环境变量优先于 config.yaml
      OMBRE_COMPRESS_BASE_URL: ${MEMORY_LLM_BASE_URL:-${UPSTREAM_BASE_URL}}
      OMBRE_COMPRESS_MODEL: ${MEMORY_LLM_MODEL:-${UPSTREAM_MODEL}}
      OMBRE_COMPRESS_API_KEY: ${MEMORY_LLM_API_KEY:-${UPSTREAM_API_KEY}}
      OMBRE_EMBED_API_KEY: ${SILICONFLOW_API_KEY:?}
      OMBRE_DASHBOARD_PASSWORD: ${OMBRE_DASHBOARD_PASSWORD:?}
      OMBRE_TRUSTED_PROXY_CIDRS: "127.0.0.0/8,::1/128"
    volumes:
      - ./data/ombre:/app/buckets
