[project]
name = "dafeiyu-gateway"
version = "0.1.0"
description = "大肥鱼记忆网关:Kelivo 与上游之间的透明代理,负责召回、注入与写入"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "mypy==2.4.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
